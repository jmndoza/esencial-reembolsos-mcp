[project]
name = "esencial-reembolsos-mcp"
version = "0.1.0"
description = "MCP server para reembolsos Isapre Esencial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "keyring>=25.7.0",
    "mcp>=1.27.1",
    "pdfplumber>=0.11.9",
    "playwright>=1.59.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[project.scripts]
esencial-mcp = "esencial.mcp.server:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esencial"]
